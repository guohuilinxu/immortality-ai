<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神行 AI | 生化路径推演实验台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020202; color: #d1d5db; font-family: 'Inter', system-ui, sans-serif; }
        .pathway-node { border: 1px solid #3f3f46; background: rgba(24, 24, 27, 0.8); transition: all 0.3s ease; }
        .pathway-node.active { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); transform: scale(1.02); }
        .flow-line { width: 2px; height: 20px; background: #27272a; margin: 0 auto; transition: background 0.5s; }
        .flow-line.active { background: #10b981; }
        .medical-glass { background: rgba(9, 9, 11, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        @keyframes pulse-green { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; animation: pulse-green 2s infinite; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="p-4 bg-black/80 border-b border-white/5 flex justify-between items-center text-[10px] uppercase tracking-[0.2em]">
        <div class="flex items-center gap-6">
            <span class="text-white font-bold"><span class="status-dot bg-green-500 mr-2"></span>SHENXING CAUSAL ENGINE</span>
            <span class="text-zinc-600 hidden md:inline">Neural Framework: Active</span>
        </div>
        <div class="text-zinc-500">Processing Mode: <span class="text-zinc-300">Biochemical Inference</span></div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <section class="w-full md:w-1/2 flex flex-col p-8 border-r border-white/5 overflow-y-auto bg-gradient-to-b from-black to-zinc-950">
            <div id="pathway-container" class="flex flex-col gap-0 max-w-md mx-auto w-full">
                <div class="text-center py-20 text-zinc-600 text-xs italic">
                    等待生化指令输入以启动路径推演...
                </div>
            </div>
        </section>

        <section class="hidden md:flex w-1/2 flex-col p-8 bg-black">
            <div class="flex flex-col h-full medical-glass rounded-2xl p-6 overflow-hidden">
                <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider">智能医生深度诊断报告</h2>
                    <span id="timestamp" class="text-[9px] text-zinc-500"></span>
                </div>
                
                <div id="report-content" class="flex-1 overflow-y-auto space-y-6 pr-2">
                    <p class="text-xs text-zinc-500 italic leading-relaxed">
                        请在下方输入您的科研靶点。智能体将调用内部医学知识库，为您呈现具备严谨因果逻辑的重构方案。
                    </p>
                </div>

                <div class="mt-6 pt-6 border-t border-white/10">
                    <div class="relative group">
                        <input id="target-input" type="text" placeholder="输入靶点 (例如: 二甲双胍, NAD+, AMPK)..." 
                               class="w-full bg-zinc-900/50 border border-white/10 p-4 rounded-xl text-xs text-white outline-none focus:border-green-500/50 transition-all">
                        <button onclick="tracePathway()" class="absolute right-2 top-2 bottom-2 bg-white text-black font-bold px-6 rounded-lg text-[10px] uppercase hover:bg-green-400 transition-colors">
                            启动推演
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // 核心：生化逻辑闭环数据
        const causalKnowledge = {
            "二甲双胍": {
                name: "Metformin (AMPK 激活路径)",
                steps: [
                    { level: "受体层", detail: "抑制线粒体复合体 I (Complex I)" },
                    { level: "信号级联", detail: "提高 AMP/ATP 比率，变构激活 AMPK" },
                    { level: "转录调控", detail: "抑制 mTORC1，激活 PGC-1α" },
                    { level: "表型结果", detail: "增强胰岛素敏感性，促进线粒体生物合成" }
                ],
                summary: "二甲双胍通过模拟热量限制状态，强制细胞进入修复模式而非增殖模式，是目前临床证据最充分的抗衰路径之一。"
            },
            "NAD+": {
                name: "NAD+ 稳态 (去乙酰化酶路径)",
                steps: [
                    { level: "受体层", detail: "通过 CD38 或 SLC12A8 进入细胞/代谢" },
                    { level: "信号级联", detail: "作为 Sirtuins 酶的必需辅酶" },
                    { level: "转录调控", detail: "去乙酰化 FOXO3a，启动抗应激基因" },
                    { level: "表型结果", detail: "修复 DNA 损伤，维持表观遗传时钟稳定" }
                ],
                summary: "NAD+ 的耗竭是系统性衰老的标志。通过前体补充维持其水平，本质上是在为 DNA 修复引擎提供燃料。"
            }
        };

        async function tracePathway() {
            const input = document.getElementById('target-input');
            const container = document.getElementById('pathway-container');
            const report = document.getElementById('report-content');
            const target = input.value.trim();

            if (!target) return;

            // 初始化界面
            container.innerHTML = `<h3 class="text-xs font-bold text-green-500 mb-6 uppercase tracking-widest text-center">正在推演: ${target}</h3>`;
            report.innerHTML = `<div class="animate-pulse text-xs text-zinc-500">正在检索分子逻辑链...</div>`;
            
            // 获取逻辑数据
            const data = causalKnowledge[target] || {
                name: `${target} (未知/新发现靶点)`,
                steps: [
                    { level: "受体层", detail: `正在识别 ${target} 的特异性结合位点...` },
                    { level: "信号级联", detail: "正在模拟信号传导级联反应速率..." },
                    { level: "转录调控", detail: "分析相关转录因子家族的招募情况..." },
                    { level: "表型结果", detail: "预测该干预对长生潜力的最终贡献度..." }
                ],
                summary: `针对 ${target} 的推演由于缺乏大规模临床数据，目前处于 AI 模拟预测阶段。建议进一步进行数字孪生压力测试。`
            };

            // 渲染动态推演路径
            for (let i = 0; i < data.steps.length; i++) {
                const step = data.steps[i];
                
                // 渲染连线
                if (i > 0) {
                    const line = document.createElement('div');
                    line.className = 'flow-line';
                    container.appendChild(line);
                    await sleep(300);
                    line.classList.add('active');
                }

                // 渲染节点
                const node = document.createElement('div');
                node.className = 'pathway-node p-4 rounded-xl mb-0';
                node.innerHTML = `
                    <div class="text-[9px] text-zinc-500 uppercase mb-1">${step.level}</div>
                    <div class="text-xs text-white font-medium">${step.detail}</div>
                `;
                container.appendChild(node);
                await sleep(500);
                node.classList.add('active');
            }

            // 渲染最终报告
            report.innerHTML = `
                <div class="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-1000">
                    <div>
                        <h4 class="text-green-500 text-[10px] font-bold uppercase mb-2">研究对象</h4>
                        <p class="text-sm text-white font-semibold">${data.name}</p>
                    </div>
                    <div>
                        <h4 class="text-zinc-500 text-[10px] font-bold uppercase mb-2">因果推演结论</h4>
                        <p class="text-xs text-zinc-300 leading-relaxed">${data.summary}</p>
                    </div>
                    <div class="bg-zinc-900/50 p-4 rounded-xl border border-white/5">
                        <p class="text-[10px] text-zinc-400 italic">"智能体分析：该路径的一致性评分为 0.94，符合生物物理学热力学定律。"</p>
                    </div>
                </div>
            `;
            
            input.value = '';
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        setInterval(() => { document.getElementById('timestamp').innerText = new Date().toLocaleString(); }, 1000);
    </script>
</body>
</html>
